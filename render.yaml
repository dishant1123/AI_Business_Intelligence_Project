services:
  - type: web
    name: smart-manufacturing-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python backend/seed_db.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-manufacturing-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://smart-manufacturing-ai.netlify.app

databases:
  - name: smart-manufacturing-db
    plan: free
